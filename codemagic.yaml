workflows:
  ios-workflow:
    name: iOS Build - KLA MEET
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - ios_signing # Add this in Codemagic > Teams > Environment variables if you have Apple certs
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.klameet.app"
      node: 20
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Install dependencies
        script: |
          npm ci
          
      - name: Add iOS platform if missing
        script: |
          if [ ! -d "ios" ]; then
            echo "No ios folder, creating..."
            npx cap add ios
          fi

      - name: Build Next.js web for Capacitor
        script: |
          CAPACITOR=true npm run build
          echo "Checking out folder..."
          ls -la out
          test -d out || (echo "ERROR: out folder not created" && exit 1)

      - name: Sync Capacitor to iOS
        script: |
          npx cap sync ios
          npx cap copy ios

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install

      - name: Set up code signing
        script: |
          # If you have signing in Codemagic dashboard, this will use it
          # If not, it will build unsigned IPA for simulator testing
          echo "Setting up signing..."

      - name: Build IPA
        script: |
          xcode-project use-profiles
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - out/**

    publishing:
      email:
        recipients:
          - hwylhuzail@gmail.com
        notify:
          success: true
          failure: true

  android-workflow:
    name: Android Build - KLA MEET
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      node: 20
      java: 17
    scripts:
      - name: Install dependencies
        script: |
          npm ci

      - name: Build Next.js web for Capacitor
        script: |
          CAPACITOR=true npm run build
          ls -la out

      - name: Sync Capacitor to Android
        script: |
          npx cap sync android
          npx cap copy android

      - name: Build Android AAB
        script: |
          cd android
          ./gradlew bundleRelease

    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk
      - out/**