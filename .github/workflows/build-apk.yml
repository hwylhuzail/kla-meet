name: Build KLA-MEET Release APK
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install --legacy-peer-deps
      - run: npm install sharp --save-dev
      - run: node scripts/generate-icons.mjs
      - run: npm run build
      - run: |
          echo '{"appId":"com.klameet.app","appName":"KLA-MEET Uganda","webDir":"dist","bundledWebRuntime":false,"plugins":{"SplashScreen":{"launchShowDuration":1500,"backgroundColor":"#FFCC00","showSpinner":false},"Geolocation":{"permissions":["ACCESS_FINE_LOCATION","ACCESS_COARSE_LOCATION"]},"Camera":{"permissions":["CAMERA","READ_EXTERNAL_STORAGE"]},"PushNotifications":{"presentationOptions":["badge","sound","alert"]}}}' > capacitor.config.json
      - run: npx cap add android || true
      - run: npx cap sync android
      - run: |
          cp public/icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp public/icon-512.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp public/icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          cp public/icon-512.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp public/icon-192.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp public/icon-192.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp public/icon-192.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp public/icon-192.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp public/icon-192.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp public/icon-192.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          mkdir -p android/app/src/main/res/drawable
          cp public/icon-512.png android/app/src/main/res/drawable/splash.png
          cp public/icon-512.png android/app/src/main/res/drawable/ic_launcher.png || true
          echo "✅ KLA launcher + splash YELLOW fixed"
      - run: sed -i "s/versionCode.*/versionCode 9/" android/app/build.gradle
      - run: sed -i "s/versionName.*/versionName \"4.0.6\"/" android/app/build.gradle
      - run: cd android && chmod +x gradlew &&./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: KLA-MEET-FINAL-YELLOW-9
          path: android/app/build/outputs/apk/debug/app-debug.apk