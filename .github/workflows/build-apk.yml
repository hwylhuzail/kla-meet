name: Build KLA-MEET Release APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install
        run: npm install --legacy-peer-deps

      - name: Build web
        run: npm run build

      - name: Clean old android (THIS FIXES YOUR FAILURE)
        run: rm -rf android

      - name: Create NATIVE config FIRST
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.klameet.app",
            "appName": "KLA-MEET Uganda",
            "webDir": "dist",
            "bundledWebRuntime": false
          }
          EOF
          cat capacitor.config.json

      - name: Add android + sync
        run: |
          npx cap add android
          npx cap sync android

      - name: Fix versionCode 5 for Uptodown
        run: |
          sed -i "s/versionCode.*/versionCode 5/" android/app/build.gradle
          sed -i "s/versionName.*/versionName \"4.0.1\"/" android/app/build.gradle
          grep version android/app/build.gradle

      - name: Build Debug APK (signed)
        run: |
          cd android
          chmod +x gradlew
         ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: KLA-MEET-4.0.1-NATIVE-APPROVED
          path: android/app/build/outputs/apk/debug/app-debug.apk