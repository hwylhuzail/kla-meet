name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install deps
        run: npm install
      - name: Build web
        run: npm run build
      - name: Add android
        run: npx cap add android
      - name: Sync android
        run: npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
         ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KLA-MEET-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk