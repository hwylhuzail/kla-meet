name: Build KLA-MEET Release APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install --legacy-peer-deps
      - run: npm run build
      - run: rm -rf android
      - run: echo '{"appId":"com.klameet.app","appName":"KLA-MEET Uganda","webDir":"dist"}' > capacitor.config.json
      - run: npx cap add android
      - run: npx cap sync android
      - run: sed -i "s/versionCode.*/versionCode 5/" android/app/build.gradle
      - run: sed -i "s/versionName.*/versionName \"4.0.1\"/" android/app/build.gradle
      - run: cd android && chmod +x gradlew &&./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: KLA-MEET-NATIVE-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk