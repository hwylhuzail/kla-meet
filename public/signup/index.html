<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign Up - KLA-MEET</title>
<style>body{background:#0a0a0a;color:#fff;font-family:system-ui;padding:24px;max-width:480px;margin:auto}.card{background:#18181b;border-radius:24px;padding:20px}input,select,textarea{width:100%;padding:12px;border-radius:999px;background:#000;border:1px solid #333;color:#fff;margin-top:8px;font-size:12px}button{width:100%;background:#FFC300;color:#000;padding:12px;border-radius:999px;font-weight:900;margin-top:12px}a{color:#FFC300}</style>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
const supabase = createClient('https://YOUR_PROJECT.supabase.co','YOUR_ANON_KEY')
window.signup = async () => {
  const name=document.getElementById('name').value
  const email=document.getElementById('email').value
  const password=document.getElementById('password').value
  const bio=document.getElementById('bio').value
  const interests=document.getElementById('interests').value
  const gender=document.getElementById('gender').value
  const age=document.getElementById('age').value
  const { data, error } = await supabase.auth.signUp({email,password})
  if(error){alert(error.message);return}
  await supabase.from('profiles').insert([{id:data.user.id,name,email,bio,interests,gender,age}])
  alert('Account created! Now Sign In')
  location.href='/signin/'
}
window.signin = async () => {
  const email=document.getElementById('email').value
  const password=document.getElementById('password').value
  const { error } = await supabase.auth.signInWithPassword({email,password})
  if(error){alert(error.message);return}
  location.href='/?page=profile'
}
</script></head><body>
<h1 style="font-weight:900">KLA-MEET • Sign Up / Sign In</h1>
<div class="card">
<input id="name" placeholder="Name">
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<div style="display:flex;gap:8px"><select id="gender" style="width:50%"><option>Female</option><option>Male</option><option>Other</option></select><input id="age" placeholder="Age" style="width:50%"></div>
<input id="interests" placeholder="Interests (Music, Travel...)">
<textarea id="bio" placeholder="Bio" style="border-radius:16px;height:70px"></textarea>
<button onclick="signup()">Sign Up (Supabase)</button>
<button onclick="signin()" style="background:#fff">Sign In (Supabase)</button>
<p style="font-size:11px;margin-top:12px;text-align:center"><a href="/">← Back to App</a></p>
</div></body></html>
